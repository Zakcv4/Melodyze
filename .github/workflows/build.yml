name: Build Melodyze VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target Melodyze_VST3

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Melodyze-Windows-VST3
          path: build/Melodyze_artefacts/Release/VST3/Melodyze.vst3
